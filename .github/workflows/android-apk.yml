# Kodu GitHub'a yükle -> Actions sekmesi -> "Android APK" -> APK'yı indir.
# Bilgisayarına Android Studio kurman gerekmez.
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      server_url:
        description: 'APK içine gömülecek varsayılan sunucu adresi (ör. http://192.168.1.20:3000). Boş bırakılabilir.'
        required: false
        default: ''

permissions:
  contents: write   # APK'yı Releases sayfasına koyabilmek için

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Bağımlılıkları kur
        run: npm install

      - name: Web dosyalarını hazırla (www/)
        run: npm run build:mobile
        env:
          SERVER_URL: ${{ github.event.inputs.server_url || vars.SERVER_URL || 'https://world-chaos-geopolitics.onrender.com' }}

      - name: Android projesini oluştur
        run: npx cap add android

      # SABİT İMZA: her sürüm aynı anahtarla imzalanır -> telefonda silmeden üstüne güncellenir.
      # (İstersen ANDROID_KEYSTORE_B64 adlı bir repo secret'ı ile kendi anahtarını verebilirsin.)
      - name: İmza anahtarını geri yükle
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-signing-key-v1

      - name: İmza anahtarı yoksa oluştur
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > ~/.android/debug.keystore; fi
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 20000 -dname "CN=World Chaos,O=Kaos Studios,C=TR"
          fi
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android | grep -m1 SHA256

      - name: Sürüm numarası (her derlemede artar)
        run: |
          G=android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" "$G"
          sed -i "s/versionName \"[^\"]*\"/versionName \"0.${{ github.run_number }}\"/" "$G"
          grep -n "versionCode\|versionName" "$G"

      - name: Yatay ekran + HTTP sunucu izni
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' "$M"
          grep -q usesCleartextTraffic "$M" || sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$M"
          # Sesli sohbet için mikrofon izni
          grep -q RECORD_AUDIO "$M" || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n</manifest>#' "$M"
          grep -n "permission" "$M"

      - name: Tam ekran oyun aktivitesi
        run: cp native/android/MainActivity.java android/app/src/main/java/com/kaosstudios/worldchaos/MainActivity.java

      - name: Senkronize et
        run: npx cap sync android

      - name: APK derle
        # Maven deposu bazen 429 (çok fazla istek) verir: 3 kez dene
        run: |
          cd android && chmod +x gradlew
          for i in 1 2 3; do
            ./gradlew assembleDebug --no-daemon && exit 0
            echo "Deneme $i başarısız, 60 sn bekleniyor..."; sleep 60
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: world-chaos-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: APK'yı adlandır
        run: cp android/app/build/outputs/apk/debug/app-debug.apk world-chaos.apk

      # Doğrudan indirme linki: https://github.com/<kullanıcı>/<depo>/releases/latest/download/world-chaos.apk
      - name: Releases sayfasına yükle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.${{ github.run_number }}
          name: World Chaos v0.${{ github.run_number }}
          body: "📱 Telefondan indir: world-chaos.apk dosyasına dokun, sonra kur."
          files: world-chaos.apk
          make_latest: true
